
server:
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true



management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: READ_ONLY

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

product:
  service:
    id: lb://PRODUCT-SERVICE

cartorder:
  service:
    id: lb://CART-ORDER-SERVICE
